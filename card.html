<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaRegister</title>
  <style>
    @font-face {
      font-family: 'Red Circle';
      src: url('REDCIRCL.ttf') format('truetype');
    }
    
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #496381;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Barlow Condensed', sans-serif;
      gap: 48px;
      flex-wrap: wrap;
      padding: 40px;
    }

    /* === CARDS === */
    .card {
      display: flex;
      flex-direction: row;
      width: 260px;
      height: 380px;
      background: #1a1a1a;
      border: 1px solid #111;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 6px 8px 8px rgba(15, 22, 30, 1.0);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 8px 10px 12px rgba(15, 22, 30, 1.0);
    }

    .card-name {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: bold;
      text-transform: uppercase;
      color: #fff;
      background: #111;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 44px;
      min-width: 44px;
      max-width: 44px;
      border-right: 3px solid #111;
      position: relative;
      z-index: 2;
      line-height: 1.0;
      text-align: center;
      overflow: hidden;
    }

    .card-name .letter {
      display: block;
      text-align: center;
      width: 100%;
    }

    .card-name .space {
      display: block;
      height: 0.4em;
    }

    .card-image {
      flex: 1;
      background-size: cover;
      background-position: top center;
      position: relative;
    }

    /* === MODAL OVERLAY === */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    /* === MODAL === */
    .modal {
      background: #f0f0f0;
      border: 2px solid #222;
      box-shadow: 8px 10px 24px rgba(15, 22, 30, 0.9);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Tab bar */
    .modal-tabs {
      background: #222;
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 4px;
      flex-shrink: 0;
    }

    /* Close button */
    .modal-close {
      position: absolute;
      top: 6px;
      right: 10px;
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      z-index: 10;
    }

    .modal-close:hover {
      color: #ccc;
    }

    /* Sheet content */
    .modal-sheet {
      flex: 1;
      background: #fff;
      overflow: hidden;
      display: flex;
      padding: 0;
      overflow: hidden;
    }

    /* Bottom buttons */
    .modal-buttons {
      background: #222;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .modal-btn {
      background: none;
      border: 1px solid #555;
      color: #ccc;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      padding: 4px 14px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s, color 0.15s;
    }

    .modal-btn:hover {
      background: #444;
      color: #fff;
    }

    .modal-btn.admin {
      color: #888;
      border-color: #444;
      cursor: default;
    }

    .sheet {
      width: 100%;
      height: 100%;
      background: #fff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sheet-title {
      border: 3px solid #111;
      border-radius: 12px;
      text-align: center;
      font-family: 'Red Circle', sans-serif;
      font-size: 1.5em;
      height: 5.15%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .sheet-middle {
  display: flex;
  gap: 10px;
  height: 44%;
  flex-shrink: 0;
}

.sheet-bio {
  width: 54%;
  border: 3px solid #111;
  border-radius: 12px;
  padding: 8px;
}

.sheet-portrait {
  flex: 1;
  border: 3px solid #111;
  border-radius: 12px;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

.sheet-section-title {
  font-family: 'Red Circle', sans-serif;
  font-size: 1em;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  text-align: center;
}
    
.sheet-bottom {
  display: flex;
  gap: 10px;
  height: 47%;
  flex-shrink: 0;
}

.sheet-powers {
  width: 46%;
  border: 3px solid #111;
  border-radius: 12px;
  padding: 8px;
}

.sheet-ability {
  flex: 1;
  border: 3px solid #111;
  border-radius: 12px;
  padding: 8px;
}

.bio-fields {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.65em;
  margin-top: 8px;
}

.bio-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 4px;
}

.bio-row {
  display: flex;
  gap: 6px;
}

.bio-label {
  font-family: 'Lucida Sans', 'Lucida Sans Unicode', sans-serif;
  font-weight: bold;
  min-width: 70px;
  flex-shrink: 0;
}

.bio-value {
  font-family: 'Lucida Sans', 'Lucida Sans Unicode', sans-serif;
}

.bio-description {
  margin-top: 4px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.powers-text {
  font-family: 'Lucida Sans', 'Lucida Sans Unicode', sans-serif;
  font-size: 0.65em;
  margin-top: 8px;
  white-space: pre-wrap;
}
  </style>
  
</head>
<body>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-tabs"></div>
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-sheet" id="modalSheet">
        <!-- Sheet content will go here -->
        <div class="sheet">
          <div class="sheet-title" id="sheetTitle">Ever Star</div>
          <div class="sheet-middle">
            <div class="sheet-bio">
            <div class="sheet-section-title">Biographical Data</div>
              <div class="bio-fields">
                <div class="bio-group">
                  <div class="bio-row"><span class="bio-label">Identity</span><span class="bio-value" id="bioIdentity"></span></div>
                  <div class="bio-row"><span class="bio-label">Skin</span><span class="bio-value" id="bioSkin"></span></div>
                  <div class="bio-row"><span class="bio-label">Hair</span><span class="bio-value" id="bioHair"></span></div>
                  <div class="bio-row"><span class="bio-label">Eyes</span><span class="bio-value" id="bioEyes"></span></div>
                  <div class="bio-row"><span class="bio-label">Height</span><span class="bio-value" id="bioHeight"></span></div>
                  <div class="bio-row"><span class="bio-label">Weight</span><span class="bio-value" id="bioWeight"></span></div>
                  <div class="bio-row"><span class="bio-label">Age</span><span class="bio-value" id="bioAge"></span></div>
                </div>
                <div class="bio-group">
                  <div class="bio-row"><span class="bio-label">Occupation</span><span class="bio-value" id="bioOccupation"></span></div>
                </div>
                <div class="bio-group">
                  <div class="bio-row"><span class="bio-label">Status</span><span class="bio-value" id="bioStatus"></span></div>
                  <div class="bio-row"><span class="bio-label">Operations</span><span class="bio-value" id="bioOperations"></span></div>
                </div>
                <div class="bio-group">
                  <div class="bio-row"><span class="bio-label">Motivation</span><span class="bio-value" id="bioMotivation"></span></div>
                  <div class="bio-row"><span class="bio-label">Trauma</span><span class="bio-value" id="bioTrauma"></span></div>
                </div>
                <div class="bio-description">
                  <div class="bio-label">Background</div>
                  <div class="bio-value" id="bioBackground"></div>
                </div>
              </div>
            </div>
            <div class="sheet-portrait"></div>
          </div>
          <div class="sheet-bottom">
            <div class="sheet-powers">
              <div class="sheet-section-title">Powers</div>
              <div class="powers-text" id="powerText"></div>
            </div>
            <div class="sheet-ability">
              <div class="sheet-section-title">Ability Profile</div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-buttons">
        <button class="modal-btn" id="btnPrev">◀ Prev</button>
        <button class="modal-btn admin">New</button>
        <button class="modal-btn admin">Delete</button>
        <button class="modal-btn admin">Publish</button>
        <button class="modal-btn" id="btnNext">Next ▶</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://aopklhrfxtyhglznelua.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9pr1docO_yBUsM4KRy09Dw_hrZF__E9';

    let characters = [];
    let currentIndex = 0;

    // Size modal to 8.5x11 proportions fitting the screen
    function sizeModal() {
      const modal = document.getElementById('modal');
      const tabsH = 36;
      const buttonsH = 44;
      const padding = 40;
      const ratio = 11 / 8.5;

      const maxW = window.innerWidth - padding * 2;
      const maxH = window.innerHeight - padding * 2;

      let sheetH = maxH - tabsH - buttonsH;
      let sheetW = sheetH / ratio;

      if (sheetW > maxW) {
        sheetW = maxW;
        sheetH = sheetW * ratio;
      }

      modal.style.width = sheetW + 'px';
      modal.style.height = (sheetH + tabsH + buttonsH) + 'px';
    }

    window.addEventListener('resize', sizeModal);
    sizeModal();

    // Open modal
    function openModal(index) {
      currentIndex = index;
      const char = characters[index];
      document.getElementById('sheetTitle').textContent = char.name;
      document.querySelector('.sheet-portrait').style.backgroundImage = char.pic_url ? `url('${char.pic_url}')` : '';
      document.getElementById('bioIdentity').textContent = char.identity || '';
      document.getElementById('bioSkin').textContent = char.skin || '';
      document.getElementById('bioHair').textContent = char.hair || '';
      document.getElementById('bioEyes').textContent = char.eyes || '';
      document.getElementById('bioHeight').textContent = char.height || '';
      document.getElementById('bioWeight').textContent = char.weight || '';
      document.getElementById('bioAge').textContent = char.age || '';
      document.getElementById('bioOccupation').textContent = char.occupation || '';
      document.getElementById('bioStatus').textContent = char.status || '';
      document.getElementById('bioOperations').textContent = char.area_of_operations || '';
      document.getElementById('bioMotivation').textContent = char.motivation || '';
      document.getElementById('bioTrauma').textContent = char.trauma || '';
      document.getElementById('bioBackground').textContent = char.short_bio || '';
      document.getElementById('modalOverlay').classList.add('active');
      const powers = char.powers || '';
      const vulner = char.vulnerabilities || '';
      document.getElementById('powerText').textContent = powers + (vulner ? '\n\n' + vulner : '');
    }

    // Close modal
    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.remove('active');
    });

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalOverlay')) {
        document.getElementById('modalOverlay').classList.remove('active');
      }
    });

    // Prev / Next
    document.getElementById('btnPrev').addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + characters.length) % characters.length;
      openModal(currentIndex);
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % characters.length;
      openModal(currentIndex);
    });

    // Build card
    function buildCard(char, index) {
      const card = document.createElement('div');
      card.className = 'card';
      card.addEventListener('click', () => openModal(index));

      const nameCol = document.createElement('div');
      nameCol.className = 'card-name';

      const name = char.name || '';
      const letters = name.replace(/ /g, '').replace(/[^a-zA-Z0-9]/g, '').length;
      const spaces = (name.match(/ /g) || []).length;
      const availableHeight = 380 - 24;
      let fontSize = letters > 0 ? availableHeight / (letters + spaces * 0.4) : 32;
      fontSize = Math.min(fontSize, 32);
      fontSize = Math.max(fontSize, 8);
      nameCol.style.fontSize = fontSize + 'px';

      for (let i = 0; i < name.length; i++) {
        const ch = name[i];
        if (ch === ' ') {
          const sp = document.createElement('span');
          sp.className = 'space';
          nameCol.appendChild(sp);
        } else if (/[^a-zA-Z0-9]/.test(ch)) {
          // skip punctuation
        } else {
          const span = document.createElement('span');
          span.className = 'letter';
          span.textContent = ch;
          nameCol.appendChild(span);
        }
      }

      const imgCol = document.createElement('div');
      imgCol.className = 'card-image';
      if (char.pic_url) {
        imgCol.style.backgroundImage = `url('${char.pic_url}')`;
      }

      card.appendChild(nameCol);
      card.appendChild(imgCol);
      document.body.appendChild(card);
    }

    async function loadCharacters() {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/mhr_characters?publish=eq.true&select=*`,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          }
        );
        const data = await response.json();
        if (!Array.isArray(data)) {
          document.body.innerHTML = '<p style="color:red">Error: ' + JSON.stringify(data) + '</p>';
          return;
        }
        characters = data;
        data.forEach((char, i) => buildCard(char, i));
      } catch (err) {
        document.body.innerHTML = '<p style="color:red">Error: ' + err.message + '</p>';
      }
    }

    loadCharacters();
  </script>
</body>
</html>
